# Provisioning automático del dashboard -- carga cualquier JSON que
# haya en grafana/dashboards/ sin que el evaluador tenga que
# importarlo a mano (tarea 1.8).
apiVersion: 1
providers:
  - name: waf-engine
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
