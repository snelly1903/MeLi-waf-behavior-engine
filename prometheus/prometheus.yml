# Prometheus scrapea al OpenTelemetry Collector (nunca directamente a
# cmd/engine, que habla OTLP/gRPC, no el formato de exposición de
# Prometheus) -- ver docs/decisiones.md, tarea 1.8.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
